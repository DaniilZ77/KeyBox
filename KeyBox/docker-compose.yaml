services:
  keybox:
    build: .
    container_name: keybox
    networks:
      - app
      - monitoring
    environment:
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - key-box-db:/app/key_box_db
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    container_name: keybox-nginx
    networks:
      - app
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keybox

  prometheus:
    image: prom/prometheus:latest
    container_name: keybox-prometheus
    networks:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: keybox-grafana
    networks:
      - app
      - monitoring
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    entrypoint:
      - sh
      - -c
      - |
        grafana cli --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini admin reset-admin-password "$${GF_SECURITY_ADMIN_PASSWORD}" || true
        /run.sh
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  key-box-db:
  prometheus-data:
  grafana-data:

networks:
  app:
  monitoring:
    internal: true

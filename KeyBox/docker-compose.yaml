services:
  keybox:
    build: .
    container_name: keybox
    networks:
      - app
      - monitoring
    environment:
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - key-box-db:/app/key_box_db
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.27-alpine
    container_name: keybox-nginx
    networks:
      - app
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - keybox

  prometheus:
    image: prom/prometheus:latest
    container_name: keybox-prometheus
    networks:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: keybox-grafana
    networks:
      - monitoring
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  key-box-db:
  prometheus-data:
  grafana-data:

networks:
  app:
  monitoring:
    internal: true

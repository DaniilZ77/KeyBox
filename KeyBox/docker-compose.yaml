services:
  keybox:
    build: .
    container_name: keybox
    ports:
      - "8001:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - key-box-db:/app/key_box_db
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: keybox-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: keybox-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  key-box-db:
  prometheus-data:
  grafana-data:
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Cargo build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: KeyBox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: KeyBox

      - name: Build
        run: cargo build --locked

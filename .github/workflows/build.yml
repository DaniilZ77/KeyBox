name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Cargo build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: KeyBox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: KeyBox

      - name: Build
        run: cargo build --locked

  deploy:
    name: Deploy to Yandex Cloud VM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    env:
      DEPLOY_PATH: ${{ secrets.YC_DEPLOY_PATH || 'keybox' }}
      SSH_PORT: ${{ secrets.YC_VM_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.YC_VM_SSH_KEY }}" > ~/.ssh/yandex_vm_key
          chmod 600 ~/.ssh/yandex_vm_key
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.YC_VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar \
            --exclude='.git' \
            --exclude='KeyBox/target' \
            --exclude='KeyBox/.env' \
            -czf "$RUNNER_TEMP/keybox.tar.gz" .

      - name: Upload application
        run: |
          ssh -i ~/.ssh/yandex_vm_key -p "$SSH_PORT" \
            "${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}" \
            "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/yandex_vm_key -P "$SSH_PORT" \
            "$RUNNER_TEMP/keybox.tar.gz" \
            "${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}:$DEPLOY_PATH/keybox.tar.gz"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/yandex_vm_key -p "$SSH_PORT" \
            "${{ secrets.YC_VM_USER }}@${{ secrets.YC_VM_HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' SECRET_KEY='${{ secrets.SECRET_KEY }}' bash -s" <<'EOF'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          tar -xzf keybox.tar.gz
          rm keybox.tar.gz

          printf 'SECRET_KEY=%s\n' "$SECRET_KEY" > KeyBox/.env
          chmod 600 KeyBox/.env

          cd KeyBox
          sudo docker-compose up --build -d
          sudo docker image prune -f
          EOF
